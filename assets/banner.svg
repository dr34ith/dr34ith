<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="900" height="210" role="img" aria-label="DR34ITH. Hello there, my name is Dreaith. I can’t function without coffee." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07050B"/>
      <stop offset="1" stop-color="#1D0C35"/>
    </linearGradient>
    <radialGradient id="light" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(230 100) scale(330 120)">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".38"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0"/>
      <stop offset=".5" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="76" y1="0" x2="446" y2="0">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset=".42" stop-color="#A855F7"/>
      <stop offset=".5" stop-color="#F3E8FF"/>
      <stop offset=".58" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#A855F7"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-440 0;440 0;440 0" keyTimes="0;.22;1" dur="9s" begin="2s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="outline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .66  0 0 0 0 .33  0 0 0 0 .97  0 0 0 .5 0"/>
    </filter>
    <clipPath id="wipe">
      <rect x="60" y="30" height="80" width="0">
        <animate attributeName="width" from="0" to="420" dur="1.4s" begin="0.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".3 0 .2 1"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    text { font-family: 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; }
    .glow { fill: #7C3AED; opacity: .4; animation: breathe 6s ease-in-out infinite alternate; }
    .drift { animation: drift 12s ease-in-out infinite alternate; }
    .in { opacity: 0; animation: f 1.2s ease-out forwards; }
    .d2s { animation-delay: 1s; } .d3s { animation-delay: 1.4s; } .d0 { animation-delay: .1s; }
    @keyframes f { to { opacity: 1; } }
    @keyframes breathe { from { opacity: .2; } to { opacity: .45; } }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(-14px,-4px); } }
    @media (prefers-reduced-motion: reduce) { .in { animation: none; opacity: 1; } .glow,.drift { animation: none; } }
  </style>

  <!-- base + light -->
  <rect width="900" height="210" fill="url(#base)"/>
  <rect width="900" height="210" fill="url(#light)"/>
  <rect width="900" height="210" filter="url(#grain)" opacity=".07"/>

  <!-- outlined 34 -->
  <g class="drift">
    <text x="868" y="178" font-size="196" font-weight="700" text-anchor="end" fill="none" stroke="url(#outline)" stroke-width="1.5" opacity=".3">34</text>
  </g>

  <!-- side bar with traveling light -->
  <rect x="52" y="42" width="2" height="126" fill="url(#bar)" opacity=".85"/>
  <rect x="51" y="42" width="4" height="22" rx="2" fill="#F3E8FF" opacity="0">
    <animate attributeName="y" values="42;146;146" keyTimes="0;.5;1" dur="7s" begin="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.55;0;0" keyTimes="0;.25;.5;1" dur="7s" begin="1.6s" repeatCount="indefinite"/>
  </rect>

  <!-- name -->
  <g clip-path="url(#wipe)">
    <text class="glow" x="76" y="98" font-size="62" font-weight="600" letter-spacing="8" filter="url(#soft)">DR34ITH</text>
    <text x="76" y="98" font-size="62" font-weight="600" letter-spacing="8" fill="url(#shine)">DR34ITH</text>
  </g>

  <!-- underline draw -->
  <rect x="78" y="110" width="0" height="1.5" fill="url(#rule)">
    <animate attributeName="width" from="0" to="300" dur="1.2s" begin="0.9s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".3 0 .2 1"/>
  </rect>

  <!-- copy -->
  <text class="in d2s" x="78" y="140" font-size="17" fill="#DDD6FE">Hello there, my name is Dreaith.</text>
  <text class="in d3s" x="78" y="164" font-size="13" fill="#8B5CF6" letter-spacing="1.5">I can’t function without coffee.</text>
</svg>
